name: Build macOS App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Import signing certificate
      run: |
        # Decode .p12 from secret
        echo "${{ secrets.SIGNING_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12

        # Create and unlock a temporary keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain

        # Import the .p12
        security import /tmp/cert.p12 -k build.keychain \
          -P "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" \
          -T /usr/bin/codesign

        # Allow codesign to access the key without prompting
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain

        # Export the certificate part as PEM and add it as trusted
        security find-certificate -c "Local Development Signing" -p build.keychain > /tmp/cert.pem
        sudo security add-trusted-cert -d -r trustRoot \
          -k /Library/Keychains/System.keychain /tmp/cert.pem

        rm /tmp/cert.p12 /tmp/cert.pem

    - name: Build and package
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Create ZIP for Sparkle
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        zip -r "Keystarter-${VERSION}.zip" Keystarter.app

    - name: Sign update
      if: startsWith(github.ref, 'refs/tags/')
      id: sign
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ZIP="Keystarter-${VERSION}.zip"

        echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > /tmp/sparkle_key.txt
        RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
        rm /tmp/sparkle_key.txt

        # Extract just the base64 signature from: sparkle:edSignature="..." length="..."
        SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

        LENGTH=$(stat -f%z "$ZIP")
        BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Keystarter.app/Contents/Info.plist)

        echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
        echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: Keystarter-app
        path: Keystarter.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Keystarter-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update appcast
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ steps.sign.outputs.version }}"
        SIGNATURE="${{ steps.sign.outputs.signature }}"
        LENGTH="${{ steps.sign.outputs.length }}"
        BUILD="${{ steps.sign.outputs.build }}"
        DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

        # Update appcast.xml using Python with proper formatting
        python3 << 'PYEOF'
        import re
        from datetime import datetime

        version = "${{ steps.sign.outputs.version }}"
        signature = "${{ steps.sign.outputs.signature }}"
        length = "${{ steps.sign.outputs.length }}"
        build = "${{ steps.sign.outputs.build }}"
        date_str = datetime.utcnow().strftime("%a, %d %b %Y %H:%M:%S +0000")

        # Build the new item with proper formatting
        new_item = f'''        <item>
            <title>Version {version}</title>
            <pubDate>{date_str}</pubDate>
            <sparkle:version>{build}</sparkle:version>
            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
            <enclosure
                url="https://github.com/J-Liu/Keystarter/releases/download/v{version}/Keystarter-{version}.zip"
                sparkle:edSignature="{signature}"
                length="{length}"
                type="application/octet-stream"/>
        </item>'''

        # Read existing file
        with open("docs/appcast.xml") as f:
            content = f.read()

        # Find the first <item> and insert before it
        match = re.search(r'<item>', content)
        if match:
            pos = match.start()
            content = content[:pos] + new_item + '\n        ' + content[pos:]
        else:
            # No existing items, insert after <language>
            content = re.sub(
                r'(<language>en</language>)',
                r'\1\n' + new_item,
                content,
                count=1
            )

        with open("docs/appcast.xml", "w") as f:
            f.write(content)
        PYEOF

        # Commit and push
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/appcast.xml
        git commit -m "Update appcast for v${VERSION}"
        git push origin HEAD:main
