name: Build macOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build
      run: swift build -c release

    - name: Create app bundle
      run: |
        APP_NAME="Keystarter"
        APP_DIR="${APP_NAME}.app"
        CONTENTS_DIR="${APP_DIR}/Contents"
        MACOS_DIR="${CONTENTS_DIR}/MacOS"
        RESOURCES_DIR="${CONTENTS_DIR}/Resources"

        # Create directory structure
        mkdir -p "${MACOS_DIR}"
        mkdir -p "${RESOURCES_DIR}"

        # Copy executable
        cp .build/release/Keystarter "${MACOS_DIR}/"

        # Copy resources
        if [ -d "Resources/Compiled" ]; then
          cp -r Resources/Compiled "${RESOURCES_DIR}/"
        fi
        if [ -d "Resources/MenuBar" ]; then
          cp -r Resources/MenuBar "${RESOURCES_DIR}/"
        fi

        # Create Info.plist
        cat > "${CONTENTS_DIR}/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Keystarter</string>
            <key>CFBundleIdentifier</key>
            <string>com.keystarter.app</string>
            <key>CFBundleName</key>
            <string>Keystarter</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSUIElement</key>
            <true/>
        </dict>
        </plist>
        EOF

        echo "App bundle created at ${APP_DIR}"

    - name: Create DMG
      run: |
        APP_NAME="Keystarter"
        APP_DIR="${APP_NAME}.app"
        DMG_NAME="${APP_NAME}-macOS.dmg"
        TEMP_DMG="temp.dmg"

        # Create temporary DMG
        hdiutil create -volname "${APP_NAME}" -srcfolder "${APP_DIR}" -ov -format UDRO "${TEMP_DMG}"

        # Convert to compressed DMG
        hdiutil convert "${TEMP_DMG}" -format UDZO -o "${DMG_NAME}"

        # Clean up
        rm "${TEMP_DMG}"

        echo "DMG created at ${DMG_NAME}"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: Keystarter-app
        path: Keystarter.app
        retention-days: 30

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Keystarter-dmg
        path: Keystarter-macOS.dmg
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Keystarter-macOS.dmg
          Keystarter.app
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
