<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9A2E"/>
      <stop offset="50%" stop-color="#C24A00"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </linearGradient>
    <linearGradient id="emboss" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A3000"/>
      <stop offset="100%" stop-color="#0E0500"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Flash-style circular bolt emblem, embossed -->
  <g fill="none" stroke="url(#emboss)" stroke-width="28"
     stroke-linecap="round" opacity="0.4">
    <!-- Three concentric arcs suggesting motion rings -->
    <circle cx="512" cy="512" r="380"/>
    <circle cx="512" cy="512" r="320"/>
    <circle cx="512" cy="512" r="260"/>
  </g>

  <!-- Embossed K, standard letterform -->
  <g fill="none" stroke="url(#emboss)" stroke-width="90"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M 380 340 L 380 684"/>
    <path d="M 380 512 L 640 340"/>
    <path d="M 380 512 L 640 684"/>
  </g>
</svg>
